<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f4f8f6" />
  <meta name="app-version" content="__APP_VERSION__" />
  <title>Health House</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/health-house-logo.svg" />
  <link rel="stylesheet" href="/static/design.css?v=__APP_VERSION__" />
  <link rel="stylesheet" href="/static/chat.css?v=__APP_VERSION__" />
  <link rel="stylesheet" href="/static/health-house.css?v=__APP_VERSION__-mint4" />
  <script type="module" src="/static/js/app.js?v=__APP_VERSION__"></script>
  <script type="module" src="/static/js/workspace.js?v=__APP_VERSION__-mint4"></script>
</head>
<body class="app chat-app">
  <div class="home-aurora" id="homeAurora" aria-hidden="true"></div>
  <a class="skip-link" href="#composerInput">跳到输入框</a>

  <header class="app-header chat-header">
    <a class="brand" id="brandLogo" href="/" aria-label="Health House · 返回首页">
      <span class="brand-logo" aria-hidden="true"></span>
      <h1 class="brand-name">Health House</h1>
    </a>
    <div class="debug-badges debug-only" id="debugBadges" aria-label="调试信息"></div>
    <p class="nav-caption">工作空间</p>
    <a class="nav-home" id="workspaceHome" href="/" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg><span>首页</span></a>
    <div class="header-actions">
      <a class="nav-home" id="workspaceAssistant" href="#assistant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l1.5-4A8.5 8.5 0 1 1 21 11.5Z"/></svg><span>AI 健康助手</span></a>
      <button type="button" class="btn btn-quiet btn-sm header-btn" id="btnMemory" aria-label="我记得的">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12a1 1 0 011 1v16l-7-4-7 4V5a1 1 0 011-1z"/></svg>
        <span class="header-btn-label">健康记忆</span>
      </button>
      <button type="button" class="btn btn-quiet btn-sm header-btn" id="btnSchedules" aria-label="用药与日程" aria-expanded="false" aria-controls="schedulesPanel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span class="header-btn-label">用药与日程</span>
      </button>
      <button type="button" class="btn btn-quiet btn-sm header-btn" id="btnProfile" aria-label="我的个人档案" aria-expanded="false" aria-controls="drawer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        <span class="header-btn-label">健康档案</span>
      </button>
    </div>
    <button type="button" class="sidebar-footer" id="workspaceAccount" aria-controls="healthSpace"><span class="profile-initial" id="workspaceAvatar"><img src="/static/images/personal-avatar.svg" width="36" height="36" alt="个人头像" /></span><strong id="workspaceUser">个人空间</strong></button>
  </header>

  <div class="layout">
    <main class="chat-main" id="main">
      <div class="workspace-bar"><div class="workspace-tools"><button type="button" class="workspace-tool" id="workspaceSchedule" aria-label="查看日程"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="6" width="16" height="15" rx="3"/><path d="M8 3v6m8-6v6M4 12h16m-11 4h2"/></svg></button><button type="button" class="workspace-profile" id="workspaceEditProfile">编辑档案 <span aria-hidden="true">＋</span></button></div></div>
      <div class="log-scroll" id="logScroll">
        <div class="log" id="log" role="log" aria-live="off" aria-label="对话记录"></div>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="jump-latest" id="jumpLatest" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>
          新消息
        </button>
        <div class="composer-inner">
          <div class="hero-actions" id="heroActions" role="group" aria-label="试试这些指令" hidden></div>
          <div class="composer-shell" id="composerShell">
            <label class="sr-only" for="composerInput">给小H发消息</label>
            <textarea id="composerInput" rows="1" enterkeyhint="send"
              placeholder="描述你的健康问题，或安排一项提醒…"
              aria-describedby="composerHint"></textarea>
            <button type="submit" class="btn btn-primary btn-send" id="btnSend" aria-label="发送">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
            </button>
          </div>
          <div class="composer-error" id="composerError" role="alert" hidden></div>
          <div class="composer-hint sr-only" id="composerHint">
            <span id="composerHintKeys">Enter 发送 · Shift + Enter 换行</span>
            <span class="hint-right">重要操作由你确认 · 健康建议仅供参考</span>
          </div>
        </div>
      </form>
    </main>

    <section class="health-context" id="healthSpace" aria-labelledby="contextTitle" tabindex="-1" hidden>
      <div class="context-heading"><h2 id="contextTitle">个人空间</h2><button type="button" class="btn btn-ghost" id="spaceBack">返回对话</button></div>
      <section class="context-person"><div class="context-identity"><span class="context-monogram" id="contextAvatar">H</span></div><h3 id="contextName">我的健康档案</h3><p id="contextMeta">正在加载档案…</p><div class="context-tags"><span id="contextBlood">血型待填写</span></div></section>
      <section class="context-section"><h3><span>病史与健康状况</span></h3><div id="contextHistory" class="context-values">正在加载…</div></section>
      <section class="context-section"><h3><span>当前用药</span></h3><div id="contextMedications" class="context-values">正在加载…</div><button type="button" class="context-text-button" id="contextReminder">管理用药提醒 <span aria-hidden="true">→</span></button></section>
      <section class="context-section context-allergies"><h3>过敏记录</h3><div id="contextAllergies" class="context-values">正在加载…</div></section>
      <button type="button" class="context-open" id="contextOpen">查看完整健康档案 <span aria-hidden="true">↗</span></button>
    </section>

    <aside class="drawer" id="drawer" aria-labelledby="drawerTitle" inert>
      <div class="drawer-inner">
        <div class="drawer-head">
          <h2 id="drawerTitle">我的个人档案</h2>
          <button type="button" class="btn-icon" id="btnDrawerClose" aria-label="收起档案">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="drawer-body" id="drawerBody"></div>
        <section class="drawer-section drawer-account" aria-labelledby="accountTitle">
          <h3 class="drawer-section-title" id="accountTitle">账号与本机数据</h3>
          <label class="dw-field-label debug-only" for="userId">User ID</label>
          <input class="field-input debug-only" id="userId" value="" readonly spellcheck="false" autocapitalize="off" aria-describedby="userIdHint" />
          <p class="dw-note debug-only" id="userIdHint">由服务器会话决定，只读。</p>
          <div class="dw-account-actions">
            <button type="button" class="btn btn-ghost btn-sm" id="btnClearLocal">清除本机对话记录</button>
          </div>
          <p class="dw-note">档案保存在服务端；对话记录只保存在这台设备的浏览器里。</p>
          <p class="dw-version">Health House v__APP_VERSION__</p>
        </section>
      </div>
    </aside>
  </div>

  <div class="backdrop" id="backdrop"></div>

  <div class="toast-wrap" id="toastWrap" role="status" aria-live="polite"></div>
  <div class="sr-only" id="srAnnounce" aria-live="polite" aria-atomic="true"></div>

  <dialog id="schedulesPanel" class="schedules-panel" aria-labelledby="schedulesTitle">
    <div class="drawer-head">
      <h2 id="schedulesTitle">用药与日程</h2>
      <button type="button" class="btn-icon" id="btnSchedulesClose" aria-label="收起用药与日程">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="schedulesBody" class="drawer-body"></div>
  </dialog>
  <noscript>
    <p class="noscript">需要开启 JavaScript 才能和小H对话。</p>
  </noscript>
</body>
</html>
